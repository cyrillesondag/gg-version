version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gosec
    - gocyclo
    - misspell
    - noctx
    - bodyclose
  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G304   # file path from variable — intentional in CLI tools

issues:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
